[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-invisivel"
version = "0.1.0"
description = "Local, personally trained camera mouse"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4", "scipy==1.15.2", "scikit-learn==1.6.1",
  "PySide6==6.8.3", "mediapipe==0.10.21", "opencv-contrib-python==4.11.0.86",
  "pynput==1.8.1", "platformdirs==4.3.7", "jax==0.4.35", "jaxlib==0.4.35"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.2", "pyinstaller==6.12.0", "pip-licenses==5.0.0"]

[project.scripts]
mouse-invisivel = "mouse_invisivel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
