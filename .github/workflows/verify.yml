name: Verify and build native desktop
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
concurrency:
  group: verify-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolate dependencies from runner-wide utilities
        shell: bash
        run: |
          python -m venv .ci-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "from pathlib import Path; print(Path('.ci-venv/Scripts').resolve())" >> "$GITHUB_PATH"
          else
            echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxcb-cursor0 libxkbcommon-x11-0 dbus
      - name: Verify the isolated interpreter
        run: python -c "import sys; print(sys.executable); assert sys.prefix != sys.base_prefix"
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install project without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check
        run: python -m ruff check src tests scripts
      - name: Test learned model and safety policy (synthetic/mocked evidence)
        run: python -m pytest -q
      - name: Import real camera/landmark libraries without opening devices
        run: python -c "import cv2; import mediapipe; print(cv2.__version__, mediapipe.__version__)"
      - name: Headless desktop smoke (no camera/input)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m mouse_invisivel --smoke-test
      - name: Dependency check
        run: python -m pip check
      - name: Inventory dependency licenses
        run: python -m piplicenses --format=json --with-license-file --no-license-path --output-file=dependency-licenses.json
      - name: Build on the native target OS
        run: python scripts/build.py
      - name: Smoke native package and retain notices
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dist/MouseInvisivel/MouseInvisivel.exe --check-libraries
            dist/MouseInvisivel/MouseInvisivel.exe --diagnostics
            dist/MouseInvisivel/MouseInvisivel.exe --smoke-test
            python scripts/check_package.py dist/MouseInvisivel/MouseInvisivel.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            dist/MouseInvisivel.app/Contents/MacOS/MouseInvisivel --check-libraries
            dist/MouseInvisivel.app/Contents/MacOS/MouseInvisivel --diagnostics
            dist/MouseInvisivel.app/Contents/MacOS/MouseInvisivel --smoke-test
            python scripts/check_package.py dist/MouseInvisivel.app/Contents/MacOS/MouseInvisivel
          else
            dist/MouseInvisivel/MouseInvisivel --check-libraries
            dist/MouseInvisivel/MouseInvisivel --diagnostics
            dist/MouseInvisivel/MouseInvisivel --smoke-test
            python scripts/check_package.py dist/MouseInvisivel/MouseInvisivel
          fi
          cp dependency-licenses.json dist/
      - name: Archive native permissions and source provenance
        env:
          MOUSE_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/package_artifact.py
      - name: Verify native archive bytes, launcher and model exclusion
        run: python scripts/verify_artifact.py artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: MouseInvisivel-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
