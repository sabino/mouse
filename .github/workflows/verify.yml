name: Verify and build native desktop
on:
  pull_request:
  push:
    branches: [main, dev, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install project without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check
        run: python -m ruff check src tests
      - name: Test learned model and safety policy (synthetic/mocked evidence)
        run: python -m pytest -q
